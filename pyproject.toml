[project]
name = "ppt-translator"
version = "1.1.0"
description = "PowerPoint Translator using Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=0.122.0",
    "aws-bedrock-token-generator>=1.1.0",
    "click>=8.4.2",
    "ddgs>=9.15.0",
    "fastmcp>=3.4.7",
    "openai>=3.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "tenacity>=9.1.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
ppt-translate = "ppt_translator.cli:cli"

[tool.setuptools.packages.find]
include = ["ppt_translator*"]

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"
